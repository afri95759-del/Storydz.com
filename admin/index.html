<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>لوحة تحكم StoryDZ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #f5f6fa;
    }
    #nc-root {
      height: 100%;
    }
    /* شاشة تحميل مؤقتة */
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loading-screen .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0e0e0;
      border-top-color: #2e7d32;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading-screen p {
      margin-top: 16px;
      color: #555;
      font-size: 15px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <p>جارٍ تحميل لوحة التحكم...</p>
  </div>

  <div id="nc-root"></div>

  <!-- 1. سكربت Netlify Identity (ضروري جداً لعمل زر التسجيل وتسجيل الدخول) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- 2. سكربت Decap CMS (لوحة التحكم نفسها) -->
  <script src="https://unpkg.com/decap-cms@^3.1.10/dist/decap-cms.js"></script>

  <script>
    // إخفاء شاشة التحميل
    window.addEventListener('load', function () {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function () { loader.remove(); }, 400);
      }
    });

    // معالجة الأخطاء في حال عدم تحميل السكربتات
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') {
        var loader = document.getElementById('loading-screen');
        if (loader) {
          loader.innerHTML =
            '<p style="color:#c62828;font-weight:bold;">تعذّر تحميل لوحة التحكم.</p>' +
            '<p style="color:#555;">تحقق من اتصالك بالإنترنت ثم أعد تحميل الصفحة.</p>' +
            '<button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;border:0;background:#2e7d32;color:#fff;border-radius:6px;cursor:pointer;">إعادة المحاولة</button>';
        }
      }
    }, true);
  </script>

</body>
</html>
